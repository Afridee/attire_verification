# Runs the attire verification API. Nest calls POST /verify on port 8000.
# Set SERVICE_API_KEY to the same secret Nest sends as X-API-Key.
services:
  attire-verification:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      ATTIRE_WARMUP: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
