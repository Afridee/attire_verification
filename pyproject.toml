[project]
name = "attire-verification"
version = "0.1.0"
description = "BR attire verification (MediaPipe Pose + FashionSigLIP) CLI and HTTP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mediapipe==0.10.21",
    "numpy>=1.26,<2",
    "open-clip-torch>=3.3.0",
    "opencv-python-headless>=4.8,<5",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.12",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "typer>=0.27.2",
    "uvicorn>=0.32",
]

[project.scripts]
attire-verification = "attire_verification.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attire_verification"]

[tool.hatch.build.targets.wheel.force-include]
"src/attire_verification/refs" = "attire_verification/refs"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
